<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Football Live Overlay</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:white}*{box-sizing:border-box}body{margin:0;background:transparent;overflow:hidden}.board{position:absolute;top:4%;left:2%;width:34%;height:74%;background:#0b1930ed;border:1px solid #4b7195;border-radius:12px;display:flex;flex-direction:column;padding:14px;gap:9px}.heading{font-weight:900;font-size:23px;color:#76d2ff;min-height:31px}.sub{font-size:12px;color:#a3bad4}.fixtures{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px;flex:1;min-height:0}.fixture{background:#1b3454;border-radius:8px;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:15px;min-width:0}.line{display:flex;justify-content:space-between;gap:5px;align-items:center}.team{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-weight:900;background:#345477;border-radius:3px;padding:4px 7px}.status{font-size:11px;color:#9fbedb}.ticker{position:absolute;left:0;right:0;bottom:0;height:9%;background:#0a1a31f5;border-top:3px solid #28a9f3;display:flex;align-items:center;gap:22px;padding:0 22px;font-size:21px}.ticker b{color:#71cfff;white-space:nowrap}.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alert{position:absolute;top:19%;left:26%;width:48%;min-height:31%;padding:24px 32px;background:linear-gradient(135deg,#126fb7,#061b38);border:3px solid #b7e9ff;border-radius:16px;box-shadow:0 14px 65px #000b;display:none;text-align:center;flex-direction:column;justify-content:center;gap:12px;animation:pop .35s ease-out}.alert.active{display:flex}.alert .big{font-size:64px;font-weight:1000}.alert .match{font-size:30px;font-weight:800}.alert .detail{font-size:20px}.alert .comp{font-size:14px;letter-spacing:2px}@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
</style></head><body><section class="board"><div class="heading" id="competition">FOOTBALL LIVE</div><div class="sub" id="page">Waiting for fixtures</div><div class="fixtures" id="fixtures"></div></section><section class="alert" id="alert" aria-live="polite"><div class="comp" id="alertcomp"></div><div class="big" id="alerttitle">GOAL!</div><div class="match" id="alertmatch"></div><div class="detail" id="alertdetail"></div></section><div class="ticker"><b>FOOTBALL LIVE</b><span id="ticker">Awaiting football updates…</span></div><script>
const order=['PL','CH','L1','L2','FAC','EFLC','UCL'];const names={PL:'PREMIER LEAGUE',CH:'EFL CHAMPIONSHIP',L1:'EFL LEAGUE ONE',L2:'EFL LEAGUE TWO',FAC:'FA CUP',EFLC:'EFL CUP',UCL:'UEFA CHAMPIONS LEAGUE'};
const params=new URLSearchParams(location.search);const rotationMs=Math.max(3000,Number(params.get('rotate')||12000));const alertMs=Math.max(2000,Number(params.get('alert')||7500));
let fixtures=[],position=0,paused=false,queue=[],seen=new Set(),tickerItems=[],alertTimer=null;
const $=id=>document.getElementById(id);function text(el,val){el.textContent=String(val??'')}
function pages(){return order.flatMap(code=>{const list=fixtures.filter(f=>f.competition===code);const out=[];for(let i=0;i<list.length;i+=6)out.push({code,items:list.slice(i,i+6),page:1+i/6,total:Math.ceil(list.length/6)});return out})}
function draw(){const p=pages();if(!p.length){text($('competition'),'FOOTBALL LIVE');text($('page'),'No fixtures available');$('fixtures').replaceChildren();return}position%=p.length;const item=p[position];text($('competition'),names[item.code]);text($('page'),`Page ${item.page} of ${item.total}`);$('fixtures').replaceChildren(...item.items.map(f=>{const card=document.createElement('div');card.className='fixture';for(const [team,score] of [[f.home,f.homeScore],[f.away,f.awayScore]]){const line=document.createElement('div');line.className='line';const name=document.createElement('span');name.className='team';text(name,team);const num=document.createElement('span');num.className='score';text(num,score);line.append(name,num);card.append(line)}const status=document.createElement('div');status.className='status';text(status,f.minute?`${f.minute}' · ${f.status}`:f.status);card.append(status);return card}))}
function addTicker(e){const kinds={goal:'GOAL',red_card:'RED CARD',half_time:'HT',full_time:'FT',var:'VAR',info:'UPDATE'};const message=e.message||`${kinds[e.kind]||'UPDATE'} · ${e.home} ${e.homeScore}–${e.awayScore} ${e.away}${e.scorer?' · '+e.scorer:''}${e.minute?` (${e.minute}')`:''}`;tickerItems.unshift(message);tickerItems=tickerItems.slice(0,40);text($('ticker'),tickerItems[0])}
function showNext(){if(!queue.length){paused=false;$('alert').classList.remove('active');return}paused=true;const e=queue.shift();text($('alertcomp'),names[e.competition]||e.competition);text($('alerttitle'),'GOAL!');text($('alertmatch'),`${e.home} ${e.homeScore} – ${e.awayScore} ${e.away}`);text($('alertdetail'),[e.team,e.scorer,e.minute?`${e.minute}'`:null].filter(Boolean).join(' · '));$('alert').classList.add('active');clearTimeout(alertTimer);alertTimer=setTimeout(showNext,alertMs)}
function event(e){if(e.eventId){if(seen.has(e.eventId))return;seen.add(e.eventId);if(seen.size>1000)seen.clear()}addTicker(e);if(e.kind==='goal'){queue.push(e);if(!paused)showNext()}}
const source=new EventSource('/events');source.onmessage=msg=>{try{const m=JSON.parse(msg.data);if(m.type==='fixtures'){fixtures=m.fixtures;draw()}else if(m.type==='event')event(m)}catch(err){console.error(err)}};
setInterval(()=>{if(!paused){const p=pages();if(p.length){position=(position+1)%p.length;draw()}}},rotationMs);
</script></body></html>
